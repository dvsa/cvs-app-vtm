<div [class]="style">
  <label tag for="{{ id }}" [id]="labelId">
    {{ controlLabel }}
    <ng-container *ngIf="tags?.length">
      <div class="flex gap-2">
        <app-tag *ngFor="let tag of tags" [type]="tag.colour">{{ tag.label }}</app-tag>
      </div>
    </ng-container>
  </label>

  <ng-container *ngIf="controlHint">
    <div class="govuk-hint" id="{{ hintId }}"> {{ controlHint }} </div>
  </ng-container>

  <ng-container *ngIf="hasError">
    <p class="govuk-error-message" id="{{ errorId }}">
      <span class="govuk-visually-hidden">Error: </span>
      <span>{{ (control?.errors | keyvalue)?.[0]?.value }}</span>
    </p>
  </ng-container>

  <div [class]="innerStyle">
<!--    <div *ngIf="prefix" class="govuk-input__suffix prefix" aria-hidden="true">-->
<!--      <ng-container [ngTemplateOutlet]="prefix.templateRef"></ng-container>-->
<!--    </div>-->
    <select
      id="{{ id }}"
    >
      <option *ngIf="allowNull" [ngValue]="null"></option>
      <option [value]="option.value" [selected]="option.value === control?.value" *ngFor="let option of options">{{ option.label }}</option>
    </select>
  </div>
</div>
