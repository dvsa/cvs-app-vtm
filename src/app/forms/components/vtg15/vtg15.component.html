@if (data(); as testResult) {
  @let isEditing = edit();

  @if (isEditing) {
    <form [formGroup]="form">
      <ng-container formArrayName="vtg15">
        <govuk-form-group-radio label="VTG15 required?" formControlName="vtg15Required">
          <govuk-radio id="vtg15RequiredTrue" label="Yes" [value]="'Yes'">
            <govuk-form-group-input
              class="govuk-label govuk-label--s"
              label="UN Number"
              prefix="UN"
              formControlName="unNumber"
              [width]="FORM_NODE_WIDTH.S"
            />
            <h1 class="govuk-label-wrapper">
              <label class="govuk-label govuk-label--s">
                Hazard classification numbers
              </label>
            </h1>
            <govuk-form-group-select
              class="govuk-label govuk-label--s"
              label="Primary Hazard Classification"
              formControlName="primaryHazardClassification"
              [options]="HAZARD_CLASSIFICATION_OPTIONS"
              [width]="FORM_NODE_WIDTH.L"
            />
            <govuk-form-group-select
              class="govuk-label govuk-label--s"
              label="Secondary Hazard Classification"
              formControlName="secondaryHazardClassification"
              [options]="HAZARD_CLASSIFICATION_OPTIONS"
              [width]="FORM_NODE_WIDTH.L"
            />
          </govuk-radio>
          <govuk-radio id="vtg15RequiredFalse" label="No" [value]="'No'">
          </govuk-radio>
        </govuk-form-group-radio>
      </ng-container>
    </form>
  }
}
