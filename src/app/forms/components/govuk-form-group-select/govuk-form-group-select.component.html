<div class="govuk-form-group">
  @if (controlLabel()) {
    <label class="govuk-label govuk-label--m tags" for="{{ id }}" [id]="labelId">
      {{ controlLabel() }}
      @if (tags().length) {
        <div class="tags">
          @for (tag of tags(); track tag) {
            <app-tag [type]="tag.colour">{{ tag.label }}</app-tag>
          }
        </div>
      }
    </label>
  }

  @if (controlHint() && !disabled()) {
    <div class="govuk-hint" id="{{ hintId }}"> {{ controlHint() }}</div>
  }

  @if (hasError) {
    @let firstError = (control?.errors | keyvalue)?.[0]?.value;
    <p class="govuk-error-message" id="{{ errorId }}">
      <span class="govuk-visually-hidden">Error: </span>
      <span>{{ (typeof firstError === 'string' ? firstError : firstError.error) }}</span>
    </p>
  }

  <select
    id="{{ id }}"
    name="{{ id }}"
    [attr.aria-describedby]="hintId"
    [attr.aria-labelledby]="labelId"
    [attr.data-testid]="id"
    [class.govuk-radios__input--error]="hasError"
    [(ngModel)]="value"
    (ngModelChange)="onChange($event)"
    (blur)="onBlur($event)"
    [class]="style"
    [disabled]="disabled()"
  >
    @if (allowNull()) {
      <option [ngValue]="null" [id]="`${id}-default`"></option>
    }

    @if (defaultOption() && !disabled()) {
      <option [selected]="true" [ngValue]="null" [id]="`${id}-default`">{{ defaultOption() }}</option>
    }
    @for (option of options(); track option) {
      <option [ngValue]="option.value" [id]="formatHtmlId(`${id}-${option.value}`)">{{ option.label }}</option>
    }
  </select>
</div>
