<div class="govuk-!-padding-4 govuk-label--s" [formGroup]="form">
  <!-- Euro standard (HGV and PSV) -->
  @if (shouldDisplayFormControl('techRecord_euroStandard')) {
    <govuk-form-group-radio
      label="Euro standard"
      formControlName="techRecord_euroStandard"
      [options]="EMISSION_STANDARD_OPTIONS"
      appFilterByTags
      [tagNames]="[]"
      [filters]="filters()"
    ></govuk-form-group-radio>
  }

  <!-- Emission limit (smoke absorption coefficient) (HGV and PSV) -->
  @if (shouldDisplayFormControl('techRecord_emissionsLimit')) {
    <govuk-form-group-input
      label="Emission limit (smoke absorption coefficient)"
      formControlName="techRecord_emissionsLimit"
      type="decimal"
      [width]="FormNodeWidth.XXS"
      appDecimalOnly
      appFilterByTags
      [tagNames]="[]"
      [filters]="filters()"
    >
      <div class="govuk-input__suffix" [class.govuk-input__suffix-disabled]="mode() !== Modes.EDIT" aria-hidden="true">
        m<sup><small>-1</small></sup>
      </div>
    </govuk-form-group-input>
  }

  <!-- Speed limiter exempt (HGV and PSV) -->
  @if (shouldDisplayFormControl('techRecord_speedLimiterMrk')) {
    <govuk-form-group-radio
      label="Speed limiter exempt"
      formControlName="techRecord_speedLimiterMrk"
      [options]="EXEMPT_OR_NOT_OPTIONS"
      appFilterByTags
      [tagNames]="['Plates']"
      [filters]="filters()"
    ></govuk-form-group-radio>
  }

  <!-- Tacho exempt (HGV and PSV) -->
  @if (shouldDisplayFormControl('techRecord_tachoExemptMrk')) {
    <govuk-form-group-radio
      label="Tacho exempt"
      formControlName="techRecord_tachoExemptMrk"
      [options]="EXEMPT_OR_NOT_OPTIONS"
      appFilterByTags
      [tagNames]="[]"
      [filters]="filters()"
    ></govuk-form-group-radio>
  }
</div>
