<app-header
  [username]="userService.name$ | async"
  (logOutEvent)="userService.logOut()"
/>
<app-phase-banner />

@let isLoading = loading();
@let isStandardLayout = isStandardLayout$ | async;

<div
  class="main-layout"
  [ngClass]="{
    'no-scroll': isLoading,
    gutters: isStandardLayout === false,
    'govuk-width-container': isStandardLayout,
  }"
>
  <app-breadcrumbs></app-breadcrumbs>
  <main
    id="main-content"
    tabindex="-1"
    class="govuk-main-wrapper {{ isStandardLayout ? '' : 'full-width' }}"
  >
    <app-global-error></app-global-error>
    <app-global-warning></app-global-warning>
    <app-spinner [loading]="isLoading"></app-spinner>
    <router-outlet></router-outlet>
  </main>
</div>

<app-footer />
