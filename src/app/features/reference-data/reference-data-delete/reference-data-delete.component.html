@let refData = refData$();
@let refDataAdminType = refDataAdmin$();

@if (refData && refDataAdminType) {
  <div class="govuk-grid-row" *appRoleRequired="Roles.ReferenceDataAmend">
    <div class="govuk-grid-column-full">
      <p class="govuk-heading-xl govuk-!-font-weight-bold">Delete this {{ $any(refDataAdminType).labelSingular }}</p>
      <dl class="govuk-summary-list">
        @for (column of  $any(refDataAdminType).columns; track column) {
          <div class="govuk-summary-list__row">
            <dt class="govuk-summary-list__key">
              {{ column.heading }}
            </dt>
            <dd class="govuk-summary-list__value">
              {{ $any(refData)[column.name] }}
            </dd>
          </div>
        }
      </dl>
      <br />
      <form [formGroup]="form">
        <govuk-form-group-textarea
          [id]="'reason'"
          label="Reason for Deletion"
          formControlName="reason"
        ></govuk-form-group-textarea>
      </form>
      <app-button-group>
        <app-button id="submit" design="warning" (clicked)="submit()">Delete</app-button>
        <app-button id="cancel" design="link" (clicked)="back()">Cancel</app-button>
      </app-button-group>
    </div>
  </div>
  <ng-container />
}
