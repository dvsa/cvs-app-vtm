<div class="govuk-grid-row" *appRoleRequired="roles.ReferenceDataAmend">
  <div class="govuk-grid-column-full">
    <h1 class="govuk-heading-xl govuk-!-font-weight-bold govuk-!-margin-bottom-3">
      Amend defect deficiency
    </h1>
    <form [formGroup]="form">
      <!-- Category -->
      <govuk-form-group-select
        formControlName="deficiencyCategory"
        [options]="deficiencyCategoryOptions"
        label="Category"
        name="deficiencyCategory"
      ></govuk-form-group-select>

      <!-- Reference -->
      <govuk-form-group-input
        formControlName="ref"
        label="Reference"
        name="deficiencyRef"
      ></govuk-form-group-input>

      <!-- ID -->
      <govuk-form-group-input
        formControlName="deficiencyId"
        label="ID"
        name="deficiencyId"
      ></govuk-form-group-input>

      <!-- Sub ID -->
      <govuk-form-group-input
        formControlName="deficiencySubId"
        label="Sub ID"
        name="deficiencySubId"
      ></govuk-form-group-input>

      <!-- Text -->
      <govuk-form-group-textarea
        formControlName="deficiencyText"
        label="Text"
        name="deficiencyText"
      ></govuk-form-group-textarea>

      <!-- Standard for prohibition -->
      <govuk-form-group-checkbox
        formControlName="stdForProhibition"
        label="Standard for prohibition"
        name="stdForProhibition"
      ></govuk-form-group-checkbox>

      <app-button-group>
        <app-button id="submit" (clicked)="handleSubmit()">Submit</app-button>  
        <app-button id="cancel" design="link" (clicked)="handleCancel()">Cancel</app-button>
      </app-button-group>
    </form>
  </div>
</div>
