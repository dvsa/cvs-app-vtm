@switch (mode()) {
  @case (Modes.CREATE) {
    <app-test-create [testResult]="testResult()"></app-test-create>
  }
  @case (Modes.AMEND) {
    <app-test-amend [testResult]="testResult()"></app-test-amend>
  }
  @default {
    <app-test-view
      [testResult]="testResult()"
      [mode]="mode()"
      [initialMode]="initialMode()"
    ></app-test-view>
  }
}
