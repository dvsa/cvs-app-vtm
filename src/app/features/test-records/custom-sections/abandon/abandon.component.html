@let testType = form.testTypes[0];
<!-- Reason for abandoning -->
<govuk-checkbox-group
  label="Why was this test abandoned?"
  hint="Select all that apply."
  [formField]="testType.reasonForAbandoning"
  [options]="abandonReasons()"
></govuk-checkbox-group>

<!-- Additional comments for abandon -->
<govuk-form-group-textarea
  [label]="abandonNotesLabel()"
  [formField]="testType.additionalCommentsForAbandon"
></govuk-form-group-textarea>
