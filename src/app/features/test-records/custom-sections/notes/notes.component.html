<div>
  @if (testService.isEditing()) {
    <!--  Notes -->
    <govuk-form-group-textarea
      label="{{ testService.additionalNotesLabel() }}"
      hint="{{ additionalNotesHint() }}"
      [formField]="form.testTypes[0].additionalNotesRecorded"
    />
  } @else {
    @if (testResult(); as testResult) {
      <table class="govuk-table">
        <tbody class="govuk-table__body">
          <tr class="govuk-table__row">
            <td class="govuk-table__header" style="width: 30%">
              {{ testService.additionalNotesLabel() }}:
            </td>
            <td
              class="govuk-table__cell whitespace-pre-line overflow-anywhere"
              id="test-additionalNotesRecorded"
            >
              {{
                testResult.testTypes[0].additionalNotesRecorded
                  | defaultNullOrEmpty
              }}
            </td>
          </tr>
        </tbody>
      </table>
    }
  }
</div>
