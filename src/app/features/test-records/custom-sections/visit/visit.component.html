<div [formGroup]="form">
  @if (mode() === Modes.EDIT) {
  <!--  Test station details -->
  <govuk-form-group-autocomplete
    label="Test station details"
    [options$]="testStations$"
    formControlName="testStationPNumber"
  />
  <govuk-form-group-input
    label="Type of test facility"
    formControlName="testStationType"
  />
  <govuk-form-group-autocomplete
    label="Tester details"
    [options$]="users$"
    formControlName="testerStaffId"
  />
  } @else {

  }
</div>
