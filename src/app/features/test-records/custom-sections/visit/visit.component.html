<div [formGroup]="form">
  @if (mode() === Modes.EDIT) {
    <!--  Test Station Details -->
    <govuk-form-group-autocomplete
      label="Test Station Details"
      [options$]="testStations$"
      [width]="FormNodeWidth.XXL"

      formControlName="testStationPNumber"
    />

    <!-- Type of test facility -->
    <govuk-form-group-input
      label="Type of test facility"
      formControlName="testStationType"
      [width]="FormNodeWidth.S"
    />

    <!-- Tester details -->
    <govuk-form-group-autocomplete
      label="Tester details"
      [options$]="users$"
      [width]="FormNodeWidth.XXL"
      formControlName="testerStaffId"
    />
  } @else {
    <table class="govuk-table">
      <tbody class="govuk-table__body">
        <tr class="govuk-table__row">
          <td class="govuk-table__header">Tester station details:</td>
          <td class="govuk-table__cell" id="test-testStationName">{{ form.controls.testStationName.value }}</td>
        </tr>
        <tr class="govuk-table__row">
          <td class="govuk-table__header">Tester details:</td>
          <td class="govuk-table__cell" id="test-testStationType">{{ form.controls.testStationType.value }}</td>
        </tr>
        <tr class="govuk-table__row">
          <td class="govuk-table__header">Tester name:</td>
          <td class="govuk-table__cell" id="test-testerName">{{ form.controls.testerName.value }}</td>
        </tr>
        <tr class="govuk-table__row">
          <td class="govuk-table__header">Tester email address:</td>
          <td class="govuk-table__cell" id="test-testerEmailAddress">{{ form.controls.testerEmailAddress.value }}</td>
        </tr>
      </tbody>
    </table>
  }
</div>
