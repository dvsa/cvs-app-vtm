@if (testResult(); as testResult) {
    @if (canDownloadMedia()) {
      <td id="media-download-link">
        <button class="link" (click)="downloadMedia()">
          Download media
        </button>
      </td>
    } @else {
      <td id="media-failure-to-capture-reason">
        {{ getFailureToCaptureDefectMediaReason() }}
      </td>
    }
}
