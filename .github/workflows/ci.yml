name: CI

on:
  # Scan target branches after merges; feature branches are checked through their PRs.
  push:
    branches: ['develop', 'feature/VTMDEV-1']
  pull_request:
    branches: ['develop', 'feature/VTMDEV-1']

permissions:
  contents: read

env:
  CI: true
  HUSKY: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: dvsa/.github/.github/workflows/nodejs-security.yaml@v2
    with:
      args: '--all-projects'
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Keep checks on one runner so checkout, Node setup, and npm ci happen once.
  ci-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run linter
        run: npm run lint

      - name: 📝 Check formatting
        run: npm run format:check

      - name: Run audit
        run: npm audit --audit-level=critical

      - name: Run tests
        run: npm run test:workflow

      - name: Build
        run: npm run build --ignore-scripts -- --configuration production
