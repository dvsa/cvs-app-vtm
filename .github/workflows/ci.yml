name: CI

on:
  push:
  pull_request:
    branches: ['develop', 'feature/VTMDEV-1']

permissions:
  contents: read

jobs:
  security:
    uses: dvsa/.github/.github/workflows/nodejs-security.yaml@v2
    with:
      args: '--all-projects'
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build
        run: npm run build --ignore-scripts -- --configuration production

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run tests
        run: npm run test:workflow

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          ENVIRONMENT: develop
          VTM_APP_CREDENTIALS: ${{ secrets.VTM_APP_CREDENTIALS }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const credentials = process.env.VTM_APP_CREDENTIALS;
          if (!credentials) {
            throw new Error('Configure the VTM_APP_CREDENTIALS Actions secret to run authenticated E2E tests.');
          }
          fs.mkdirSync('e2e/creds', { recursive: true });
          fs.writeFileSync('e2e/creds/app-credential.json', credentials, { mode: 0o600 });
          NODE
          npm run test:e2e

      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run linter
        run: npm run lint

      - name: 📝 Check formatting
        run: npm run format:check

  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Run audit
        run: npm audit --audit-level=critical
